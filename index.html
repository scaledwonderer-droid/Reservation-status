<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf5ff">
<title>予約状況画像ジェネレーター</title>
<style>
:root{--ink:#263d5e;--muted:#71839a;--line:#d8e5f2;--blue:#5795df;--pale:#f3f9ff;--white:#fff;--shadow:0 12px 34px rgba(54,91,137,.10)}
@font-face{font-family:"Zen Kurenaido";src:url("./fonts/ZenKurenaido-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Hachi Maru Pop";src:url("./fonts/HachiMaruPop-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(145deg,#eef7ff 0%,#f9fcff 45%,#edf4ff 100%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:1780px;margin:0 auto;padding:22px 24px 36px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 20px}
.title-wrap h1{font-size:clamp(21px,2vw,30px);margin:0;font-weight:750;letter-spacing:.02em;color:#24466c}
.title-wrap p{margin:5px 0 0;color:#70849d;font-size:13px}
.spec-pill{border:1px solid #d0e1f3;border-radius:999px;background:rgba(255,255,255,.72);padding:8px 14px;color:#54779c;font-size:12px;white-space:nowrap}
.workspace{display:grid;grid-template-columns:minmax(340px,430px) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:rgba(255,255,255,.87);border:1px solid rgba(207,224,241,.94);box-shadow:var(--shadow);border-radius:18px}
.editor{padding:17px;max-height:calc(100vh - 105px);overflow:auto;scrollbar-color:#c6d9ec transparent;scrollbar-width:thin}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.section-head h2{font-size:16px;margin:0;color:#315579}
.font-setting{display:grid;grid-template-columns:1fr;gap:6px;margin:0 0 13px;padding:11px 12px;border:1px solid #dce8f3;border-radius:12px;background:linear-gradient(135deg,#fbfdff,#f3f9ff)}
.font-setting label{font-size:11px;color:#71849b;font-weight:650}
.font-setting select{height:36px;padding:0 10px;border:1px solid #d8e5f1;border-radius:8px;background:#fff;color:#315579;font:600 13px system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;outline:none}
.font-setting select:focus{border-color:#82afe0;box-shadow:0 0 0 3px rgba(101,161,218,.13)}
.font-setting small{font-size:10px;color:#8394a8}
.counter{font-size:12px;color:#7188a2}
.button{border:1px solid #c9dcee;background:linear-gradient(#fff,#f4f9ff);color:#355a7f;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:650;box-shadow:0 2px 5px rgba(56,92,135,.05);transition:.15s ease}
.button:hover{border-color:#92b9e4;background:#f4f9ff;transform:translateY(-1px)}
.button.primary{background:linear-gradient(135deg,#5599e4,#75b3ee);border-color:#5796da;color:#fff;box-shadow:0 5px 12px rgba(78,147,218,.18)}
.button.danger{color:#a55767;border-color:#efd4da;background:#fff8f9}
.button.small{padding:5px 8px;font-size:12px;min-width:34px}
#castList{display:grid;gap:10px}
.cast-panel{border:1px solid #dce8f3;border-radius:14px;background:linear-gradient(160deg,#fff,#f8fbff);padding:11px}
.cast-head{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:7px;align-items:center}
.number-badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eaf4ff;color:#5a86b3;font-size:11px;font-weight:750}
.cast-name-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#35577a}
.cast-head-actions{grid-column:2/4;display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:-1px}
.show-toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#637c97;white-space:nowrap}
.show-toggle input{accent-color:#5f9cdc}
.field{display:grid;gap:5px;min-width:0}
.field label,.field-label{font-size:11px;color:#71849b;font-weight:650}
.field input[type=text]{height:34px;padding:0 10px;border:1px solid #d8e5f1;border-radius:8px;background:#fff;color:#294665;outline:none;width:100%}
.field input[type=text]:focus{border-color:#82afe0;box-shadow:0 0 0 3px rgba(101,161,218,.13)}
.cast-main{display:grid;grid-template-columns:68px 1fr;gap:9px;align-items:center;margin-top:9px}
.thumb{width:68px;height:72px;border:1px solid #d8e6f2;border-radius:9px;background-color:#f8fbfe;background-image:linear-gradient(45deg,#e8eef4 25%,transparent 25%),linear-gradient(-45deg,#e8eef4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8eef4 75%),linear-gradient(-45deg,transparent 75%,#e8eef4 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;display:grid;place-items:center;overflow:hidden;color:#8ca0b6;font-size:10px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.file-button{display:flex;align-items:center;justify-content:center;min-height:35px;border:1px dashed #a9c6e2;border-radius:9px;background:#f5faff;color:#4d79a4;font-size:12px;font-weight:650;cursor:pointer;padding:6px;text-align:center}
.file-button:hover{background:#edf6ff;border-color:#7fadd9}
.file-button input{display:none}
.image-file-name{font-size:10px;color:#8192a6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.crop-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.range-field{display:grid;gap:3px}
.range-top{display:flex;justify-content:space-between;gap:4px;color:#70839a;font-size:10px}
.range-top output{color:#50769b;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#6da8df;height:16px;margin:0}
.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.status-button{min-height:39px;border:1px solid #d7e5f2;border-radius:9px;background:rgba(255,255,255,.85);color:#526b87;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.status-button:hover{border-color:#9ebcda;background:#fff}
.status-button .mark{font-size:21px;line-height:1;font-weight:850}
.status-button.is-check .mark{color:#df4055}.status-button.is-cross .mark{color:#285ecb}
.status-button.is-check{border-color:#f0c9d0;background:#fff8f9}.status-button.is-cross{border-color:#c9d7f1;background:#f6f8ff}
.add-row{display:flex;justify-content:center;margin:12px 0 18px}
.add-row .button{width:100%}
.divider{height:1px;background:#e6eef6;margin:15px 0}
.logo-section{display:grid;gap:9px}
.logo-heading{display:flex;align-items:center;justify-content:space-between}
.logo-heading h3{font-size:14px;margin:0;color:#355a7d}
.logo-controls{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center}
.logo-preview{width:68px;height:58px;border:1px solid #d8e6f2;border-radius:8px;background:#f6faff;display:grid;place-items:center;overflow:hidden;color:#8799ad;font-size:10px;text-align:center}
.logo-preview img{width:100%;height:100%;object-fit:contain}
.logo-sliders{display:grid;gap:7px}
.io-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.io-actions .button{flex:1;min-width:122px}
.file-hidden{display:none}
.save-note{min-height:17px;margin:9px 2px 0;font-size:11px;color:#7890a9}
.stage{padding:14px;position:sticky;top:16px}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 3px 12px}
.stage-head strong{font-size:14px;color:#365a7d}
.stage-head span{font-size:11px;color:#8597ab}
.canvas-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#eaf5ff;box-shadow:0 7px 26px rgba(55,96,143,.14);border:1px solid #d2e2f1}
 canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none;cursor:default}
.empty-note{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#54799f;font-size:clamp(14px,2vw,22px);text-shadow:0 1px 8px white;text-align:center;padding:20px}
.empty-note span{display:inline-block;padding:12px 18px;border:1px solid rgba(204,225,243,.7);border-radius:999px;background:rgba(255,255,255,.58);backdrop-filter:blur(8px)}
.export-row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.export-row .button{min-width:145px;padding:10px 15px;font-size:14px}
.toast{position:fixed;right:20px;bottom:20px;max-width:min(440px,calc(100vw - 40px));padding:11px 15px;border-radius:12px;background:#2c5278;color:#fff;box-shadow:0 8px 25px rgba(30,63,100,.25);font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1080px){.workspace{grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:13px}.app{padding:18px 14px}.stage{padding:10px}}
@media(max-width:800px){.workspace{grid-template-columns:1fr}.editor{max-height:none;order:2}.stage{position:static;order:1}.topbar{align-items:flex-start}.spec-pill{font-size:10px;padding:7px 9px}.stage-head span{display:none}}
@media(max-width:480px){.app{padding:12px 9px 24px}.title-wrap p{font-size:11px}.editor{padding:12px}.stage{padding:8px}.export-row .button{min-width:0;flex:1}.crop-controls{gap:5px}.cast-head-actions{gap:4px}.button.small{min-width:30px;padding:5px 6px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title-wrap"><h1>予約状況画像ジェネレーター</h1><p>キャスト画像と予約状況を配置して、告知用画像を作成します。</p></div>
    <div class="spec-pill">1920 × 1080　／　最大10名</div>
  </header>
  <main class="workspace">
    <section class="panel editor" aria-label="画像編集">
      <div class="section-head"><h2>キャスト設定</h2><span class="counter" id="castCounter">0 / 10</span></div>
      <div class="font-setting"><label for="fontSelect">完成画像のフォント</label><select id="fontSelect"><option value="Zen Kurenaido">Zen Kurenaido</option><option value="Hachi Maru Pop">Hachi Maru Pop</option></select><small>キャスト名と A / B / C に反映します</small></div>
      <div id="castList"></div>
      <div class="add-row"><button class="button primary" id="addCast">＋ キャストを追加</button></div>
      <div class="divider"></div>
      <section class="logo-section">
        <div class="logo-heading"><h3>ロゴ</h3><button class="button small danger" id="removeLogo" hidden>削除</button></div>
        <div class="logo-controls">
          <div class="logo-preview" id="logoPreview">画像なし</div>
          <div><label class="file-button">ロゴ画像を登録<input type="file" id="logoFile" accept="image/*"></label><div class="image-file-name" id="logoFileName">PNG等の画像を選択</div></div>
        </div>
        <div class="logo-sliders">
          <div class="range-field"><div class="range-top"><span>サイズ</span><output id="logoSizeOut">25%</output></div><input type="range" id="logoSize" min="8" max="350" value="25"></div>
          <div class="range-field"><div class="range-top"><span>左右位置</span><output id="logoXOut">50%</output></div><input type="range" id="logoX" min="0" max="100" value="50"></div>
          <div class="range-field"><div class="range-top"><span>上下位置</span><output id="logoYOut">9%</output></div><input type="range" id="logoY" min="0" max="100" value="9"></div>
        </div>
      </section>
      <div class="io-actions">
        <button class="button" id="exportJson">設定をJSON保存</button>
        <label class="button" for="importJson" style="text-align:center">JSONを読み込む</label><input class="file-hidden" type="file" id="importJson" accept=".json,application/json">
      </div>
      <p class="save-note" id="saveNote">編集内容はこのブラウザに自動保存されます。</p>
    </section>
    <section class="panel stage" aria-label="完成画像プレビュー">
      <div class="stage-head"><strong>完成プレビュー</strong><span>出力サイズ 1920 × 1080 px</span></div>
      <div class="canvas-wrap"><canvas id="preview" width="1920" height="1080" aria-label="1920×1080完成画像"></canvas><div class="empty-note" id="emptyNote"><span>キャストを追加すると、ここにプレビューされます</span></div></div>
      <div class="export-row"><button class="button primary" id="savePng">PNGで保存</button><button class="button primary" id="saveJpg">JPGで保存</button></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const DB_NAME='reservation-status-generator-v1', STORE_NAME='settings';
const $=s=>document.querySelector(s);
const canvas=$('#preview'), ctx=canvas.getContext('2d');
const castList=$('#castList'), toast=$('#toast');
const bg=new Image();
bg.onload=()=>renderCanvas(); bg.src=BACKGROUND_URL;
const imageCache=new Map();
let state={casts:[],logo:{imageData:'',size:25,x:50,y:9},fontFamily:'Zen Kurenaido'};
let saveTimer,toastTimer,fontLoadToken=0;

function uid(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():`cast-${Date.now()}-${Math.random().toString(36).slice(2)}`}
function newCast(){return {id:uid(),name:'',visible:true,imageData:'',scale:100,x:0,y:0,slots:[0,0,0]}}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB unavailable'));return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE_NAME))req.result.createObjectStore(STORE_NAME)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
const dbPromise=openDb();
function validState(value){
  if(!value||!Array.isArray(value.casts))return null;
  const casts=value.casts.slice(0,10).map((c,i)=>({id:String(c.id||uid()),name:String(c.name||''),visible:c.visible!==false,imageData:typeof c.imageData==='string'?c.imageData:'',scale:clampNum(c.scale,50,350,100),x:clampNum(c.x,-100,100,0),y:clampNum(c.y,-100,350,0),slots:Array.isArray(c.slots)?[0,1,2].map(k=>[0,1,2].includes(Number(c.slots[k]))?Number(c.slots[k]):0):[0,0,0]}));
  const l=value.logo||{};
   return {casts,logo:{imageData:typeof l.imageData==='string'?l.imageData:'',size:clampNum(l.size,8,350,25),x:clampNum(l.x,0,100,50),y:clampNum(l.y,0,100,9)},fontFamily:value.fontFamily==='Hachi Maru Pop'?'Hachi Maru Pop':'Zen Kurenaido'};
}
function clampNum(v,min,max,fallback){v=Number(v);return Number.isFinite(v)?Math.min(max,Math.max(min,v)):fallback}
async function loadState(){
  try{const db=await dbPromise;const saved=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readonly');const req=tx.objectStore(STORE_NAME).get('main');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const clean=validState(saved);if(clean)return clean}catch(e){}
  try{const raw=localStorage.getItem(DB_NAME);if(raw){const clean=validState(JSON.parse(raw));if(clean)return clean}}catch(e){}
  return {casts:[],logo:{imageData:'',size:25,x:50,y:9},fontFamily:'Zen Kurenaido'};
}
async function persist(){
  try{const db=await dbPromise;await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(JSON.parse(JSON.stringify(state)),'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});$('#saveNote').textContent='保存済み';}
  catch(e){try{localStorage.setItem(DB_NAME,JSON.stringify(state));$('#saveNote').textContent='保存済み';}catch(err){$('#saveNote').textContent='画像データが大きく、ブラウザ保存できません。JSON保存をご利用ください。'}}

function queueSave(){clearTimeout(saveTimer);$('#saveNote').textContent='保存中…';saveTimer=setTimeout(persist,350)}

async function loadCanvasFont(family){
  const selected=family==='Hachi Maru Pop'?'Hachi Maru Pop':'Zen Kurenaido',token=++fontLoadToken;
  try{if(document.fonts?.load)await document.fonts.load(`400 32px "${selected}"`,'予約状況 キャスト名 ABC 123 © SQUARE ENIX © scaledwonderer-droid')}catch(e){}

function readDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
function roundedRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function cardLayout(count){
  if(count<=4){const gap=28,w=Math.min(370,Math.floor((WIDTH-100-gap*(count-1))/count)),h=560,total=count*w+(count-1)*gap;return {multi:false,w,h,gap,x:(WIDTH-total)/2,y:260}}

function framePlacements(casts){
  if(!casts.length)return [];
  const l=cardLayout(casts.length);
  if(l.pattern==='w'){
    const start=(WIDTH-(5*l.w+4*l.gapX))/2,topY=l.y,bottomY=l.y+l.h+l.gapY,placements=new Array(casts.length);
    [0,2,4].forEach(i=>placements[i]={cast:casts[i],x:start+i*(l.w+l.gapX),y:topY,w:l.w,h:l.h,multi:true});
    [1,3].forEach(i=>placements[i]={cast:casts[i],x:start+i*(l.w+l.gapX),y:bottomY,w:l.w,h:l.h,multi:true});

  if(!l.multi)return casts.map((cast,i)=>({cast,x:l.x+i*(l.w+l.gap),y:l.y,w:l.w,h:l.h,multi:false}));

function frameMetrics(x,y,w,h,multi){const nameH=multi?50:66,slotH=multi?76:88,innerX=x+12,innerW=w-24,imageY=y+13,imageBottom=y+h-nameH-slotH-12,imageH=imageBottom-imageY;return {nameH,slotH,innerX,innerW,imageY,imageH}}
function drawFrame(cast,x,y,w,h,multi){
  const {nameH,slotH,innerX,innerW,imageY,imageH}=frameMetrics(x,y,w,h,multi);
  ctx.save();
  ctx.shadowColor='rgba(55,91,131,.18)';ctx.shadowBlur=17;ctx.shadowOffsetY=5;roundedRect(ctx,x,y,w,h,17);ctx.fillStyle='rgba(248,253,255,.70)';ctx.fill();ctx.restore();

  roundedRect(ctx,x+5,y+5,w-10,h-10,13);ctx.strokeStyle='rgba(137,174,208,.76)';ctx.lineWidth=1.6;ctx.stroke();
  roundedRect(ctx,x+10,y+10,w-20,h-20,10);ctx.strokeStyle='rgba(255,255,255,.88)';ctx.lineWidth=1;ctx.stroke();
  // Soft, pale portrait ground keeps every transparent cutout clear.
  roundedRect(ctx,innerX,imageY,innerW,imageH+3,9);ctx.fillStyle='rgba(239,248,255,.47)';ctx.fill();
  ctx.save();roundedRect(ctx,innerX,imageY,innerW,imageH+3,9);ctx.clip();
  const img=imageFor(cast.imageData);
  if(img){const fit=Math.min(innerW/img.naturalWidth,imageH/img.naturalHeight)*(cast.scale/100),iw=img.naturalWidth*fit,ih=img.naturalHeight*fit,cx=innerX+innerW/2+(cast.x/100)*innerW*.36,cy=imageY+imageH/2+(cast.y/100)*imageH*.36;ctx.drawImage(img,cx-iw/2,cy-ih/2,iw,ih)}
  ctx.restore();

  const nameY=y+h-nameH-slotH-5;
  roundedRect(ctx,innerX,nameY,innerW,nameH+2,9);ctx.fillStyle='rgba(255,255,255,.91)';ctx.fill();ctx.strokeStyle='rgba(170,195,220,.78)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#304e70';ctx.font=`700 ${multi?27:32}px "${state.fontFamily}", system-ui, -apple-system, "Yu Gothic UI", "Meiryo", sans-serif`;let label=cast.name||'';while(ctx.measureText(label).width>innerW-28&&label.length>1){label=label.slice(0,-1)}if(label!==cast.name&&label.length>1)label+='…';ctx.fillText(label,innerX+innerW/2,nameY+nameH/2,innerW-22);ctx.restore();

  roundedRect(ctx,innerX,slotY,innerW,slotH-4,8);ctx.fillStyle='rgba(255,255,255,.94)';ctx.fill();ctx.strokeStyle='rgba(170,195,220,.82)';ctx.lineWidth=1.2;ctx.stroke();
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(innerX+cellW*i,slotY+7);ctx.lineTo(innerX+cellW*i,slotY+slotH-11);ctx.strokeStyle='rgba(183,201,220,.70)';ctx.lineWidth=1;ctx.stroke()}

  // Small silver corner accents.

}
function drawLogo(){if(!state.logo.imageData)return;const img=imageFor(state.logo.imageData);if(!img)return;const size=state.logo.size/100,maxW=WIDTH*size,maxH=HEIGHT*size,scale=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale,targetX=WIDTH*state.logo.x/100,targetY=HEIGHT*state.logo.y/100,cx=w<=WIDTH?clampNum(targetX,w/2,WIDTH-w/2):targetX,cy=h<=HEIGHT?clampNum(targetY,h/2,HEIGHT-h/2):targetY;ctx.drawImage(img,cx-w/2,cy-h/2,w,h)}
function drawCopyright(){
  const labels=['© SQUARE ENIX','© scaledwonderer-droid'];
  ctx.save();ctx.font=`400 17px "${state.fontFamily}", system-ui, sans-serif`;
  const padX=14,boxH=34,columnGap=14,dividerGap=12,widthA=ctx.measureText(labels[0]).width,widthB=ctx.measureText(labels[1]).width,boxW=padX*2+widthA+columnGap+1+dividerGap+widthB,x=WIDTH-30-boxW,y=HEIGHT-24-boxH;
  roundedRect(ctx,x,y,boxW,boxH,10);ctx.fillStyle='rgba(255,255,255,.72)';ctx.fill();ctx.strokeStyle='rgba(150,178,205,.62)';ctx.lineWidth=1;ctx.stroke();
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#5a718b';const textY=y+boxH/2,textAX=x+padX,dividerX=textAX+widthA+columnGap, textBX=dividerX+1+dividerGap;

function renderCanvas(){
  ctx.clearRect(0,0,WIDTH,HEIGHT);

  drawCopyright();

let activeCanvasDrag=null;
function canvasPoint(event){const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return null;return {x:(event.clientX-rect.left)*WIDTH/rect.width,y:(event.clientY-rect.top)*HEIGHT/rect.height}}

function renderEditor(){
  $('#castCounter').textContent=`${state.casts.length} / 10`;
  $('#fontSelect').value=state.fontFamily;

      <div class="cast-head-actions"><button class="button small" data-action="up" data-i="${i}" aria-label="上へ" ${i===0?'disabled':''}>↑</button><button class="button small" data-action="down" data-i="${i}" aria-label="下へ" ${i===state.casts.length-1?'disabled':''}>↓</button><button class="button small danger" data-action="delete" data-i="${i}">削除</button></div></div>

         <label class="range-field"><span class="range-top"><span>拡大縮小</span><output>${c.scale}%</output></span><input type="range" min="50" max="350" value="${c.scale}" data-action="scale" data-i="${i}"></label>
        <label class="range-field"><span class="range-top"><span>左右位置</span><output>${c.x}</output></span><input type="range" min="-100" max="100" value="${c.x}" data-action="x" data-i="${i}"></label>

function refresh(){renderCanvas();queueSave()}

$('#addCast').addEventListener('click',()=>{if(state.casts.length>=10){notify('キャストは最大10名です。');return}state.casts.push(newCast());renderEditor();refresh()});
$('#fontSelect').addEventListener('change',e=>{state.fontFamily=e.target.value==='Hachi Maru Pop'?'Hachi Maru Pop':'Zen Kurenaido';renderCanvas();queueSave();loadCanvasFont(state.fontFamily)});
castList.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const i=Number(b.dataset.i),action=b.dataset.action;if(!state.casts[i])return;

castList.addEventListener('input',e=>{const el=e.target,action=el.dataset.action,i=Number(el.dataset.i),c=state.casts[i];if(!c)return;

castList.addEventListener('change',async e=>{const el=e.target;if(el.dataset.action!=='cast-image')return;const file=el.files&&el.files[0],c=state.casts[Number(el.dataset.i)];if(!file||!c)return;if(file.type!=='image/png'){notify('背景透過PNGを選んでください。');el.value='';return}try{c.imageData=await readDataUrl(file);renderEditor();refresh()}catch(err){notify('画像の読み込みに失敗しました。')}});
$('#logoFile').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{state.logo.imageData=await readDataUrl(file);renderEditor();refresh()}catch(err){notify('ロゴ画像の読み込みに失敗しました。')}});
$('#removeLogo').addEventListener('click',()=>{state.logo.imageData='';$('#logoFile').value='';renderEditor();refresh()});
for(const id of ['logoSize','logoX','logoY'])$('#'+id).addEventListener('input',e=>{const key={logoSize:'size',logoX:'x',logoY:'y'}[id];state.logo[key]=Number(e.target.value);$('#'+{size:'logoSizeOut',x:'logoXOut',y:'logoYOut'}[key]).textContent=`${state.logo[key]}%`;renderCanvas();queueSave()});
$('#savePng').addEventListener('click',()=>downloadImage('image/png','reservation-status.png'));
$('#saveJpg').addEventListener('click',()=>downloadImage('image/jpeg','reservation-status.jpg',.94));
async function downloadImage(type,name,quality){if(!bg.complete||!bg.naturalWidth){notify('背景の読み込みが終わってから保存してください。');return}await loadCanvasFont(state.fontFamily);renderCanvas();canvas.toBlob(blob=>{if(!blob){notify('画像を書き出せませんでした。');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify(`${name} を保存しました。1920 × 1080 pxです。`)},type,quality)}
$('#exportJson').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reservation-settings.json';a.click();URL.revokeObjectURL(url)});
$('#importJson').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),clean=validState(parsed.state||parsed);if(!clean)throw new Error('bad file');state=clean;imageCache.clear();renderEditor();renderCanvas();queueSave();loadCanvasFont(state.fontFamily);notify('設定を読み込みました。')}catch(err){notify('JSONを読み込めませんでした。設定ファイルをご確認ください。')}e.target.value=''});
(async()=>{state=await loadState();renderEditor();renderCanvas();loadCanvasFont(state.fontFamily)})();
